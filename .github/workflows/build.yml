name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Por defecto, solo lectura. Únicamente el job de release puede escribir.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write      # solo para la atestación de procedencia (firma Sigstore de GitHub)
      attestations: write
    steps:
      # Acciones fijadas por commit (no por etiqueta) para evitar cambios no revisados
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest bandit pip-audit

      # El bootloader precompilado de PyInstaller es el mismo que usa mucho malware hecho en Python y
      # dispara falsos positivos en antivirus heurísticos. Se compila desde el código fuente (MSVC del runner).
      - name: PyInstaller con bootloader compilado desde el código fuente
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          pip install --no-cache-dir --no-binary pyinstaller pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar PyInstaller desde el código fuente" }
          $bl = python -c "import PyInstaller, pathlib; print(pathlib.Path(PyInstaller.__file__).parent / 'bootloader' / 'Windows-64bit-intel' / 'runw.exe')"
          $age = (Get-Date) - (Get-Item $bl).LastWriteTime
          Write-Host "Bootloader: $bl (hace $([int]$age.TotalMinutes) min)"
          if ($age.TotalHours -gt 2) { throw "El bootloader no se ha compilado en esta ejecución" }
          (Get-FileHash $bl -Algorithm SHA256).Hash

      - name: Tests (incluye tests de seguridad)
        run: python -m pytest -q tests

      - name: Análisis estático (bandit, severidad media/alta)
        run: python -m bandit -q -r iroptimizer app.py -ll

      - name: Vulnerabilidades conocidas en dependencias (pip-audit)
        run: python -m pip_audit -r requirements.txt

      - name: Descargar PresentMon (Intel, MIT) y verificar su firma
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          $ok = $false
          foreach ($tag in @("v2.6.0", "v2.3.1")) {
            gh release download $tag -R GameTechDev/PresentMon -p "PresentMon-*-x64.exe" -D tools --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true; Write-Host "PresentMon $tag"; break }
          }
          if (-not $ok) { throw "No se pudo descargar PresentMon" }
          $exe = Get-ChildItem tools -Filter "PresentMon-*-x64.exe" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Firma: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Intel Corporation") {
            throw "Firma de PresentMon no válida"
          }
          (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          Move-Item $exe.FullName tools\PresentMon.exe -Force

      - name: Información de versión del .exe
        run: python packaging/make_version_info.py

      - name: Compilar ejecutable
        run: >
          pyinstaller --noconfirm --onefile --windowed --noupx
          --name iRacingOptimizer --icon assets/icon.ico
          --version-file build/version_info.txt
          --add-data "assets/icon.png;assets" --add-data "assets/icon.ico;assets"
          --add-data "tools/PresentMon.exe;tools" --add-data "THIRD_PARTY_NOTICES.md;."
          --hidden-import irsdk --hidden-import pynvml --hidden-import yaml
          app.py

      - name: Probar que arranca la CLI
        shell: pwsh
        run: |
          $p = Start-Process dist\iRacingOptimizer.exe -ArgumentList "demo --out $env:RUNNER_TEMP\demo --no-browser" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP\demo\session_demo.report.html")) { exit 1 }

      - name: Suma SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\iRacingOptimizer.exe -Algorithm SHA256).Hash.ToLower()
          "$h  iRacingOptimizer.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      # Atestación de procedencia: prueba firmada de que este .exe salió de este repositorio, de este commit y
      # de este workflow. Se comprueba con: gh attestation verify iRacingOptimizer.exe -R empg80/iRacing-Optimizer
      - name: Atestación de procedencia
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/iRacingOptimizer.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iRacingOptimizer-windows
          path: |
            dist/iRacingOptimizer.exe
            dist/SHA256SUMS.txt

  release:
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: iRacingOptimizer-windows
          path: dist
      - name: Adjuntar a la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/iRacingOptimizer.exe
            dist/SHA256SUMS.txt
