name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Por defecto, solo lectura. Únicamente el job de release puede escribir.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Acciones fijadas por commit (no por etiqueta) para evitar cambios no revisados
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pytest bandit pip-audit

      - name: Tests (incluye tests de seguridad)
        run: python -m pytest -q tests

      - name: Análisis estático (bandit, severidad media/alta)
        run: python -m bandit -q -r iroptimizer app.py -ll

      - name: Vulnerabilidades conocidas en dependencias (pip-audit)
        run: python -m pip_audit -r requirements.txt

      - name: Compilar ejecutable
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name iRacingOptimizer --icon assets/icon.ico
          --add-data "assets/icon.png;assets" --add-data "assets/icon.ico;assets"
          --hidden-import irsdk --hidden-import pynvml --hidden-import yaml
          app.py

      - name: Probar que arranca la CLI
        shell: pwsh
        run: |
          $p = Start-Process dist\iRacingOptimizer.exe -ArgumentList "demo --out $env:RUNNER_TEMP\demo --no-browser" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP\demo\session_demo.report.html")) { exit 1 }

      - name: Suma SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\iRacingOptimizer.exe -Algorithm SHA256).Hash.ToLower()
          "$h  iRacingOptimizer.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iRacingOptimizer-windows
          path: |
            dist/iRacingOptimizer.exe
            dist/SHA256SUMS.txt

  release:
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: iRacingOptimizer-windows
          path: dist
      - name: Adjuntar a la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/iRacingOptimizer.exe
            dist/SHA256SUMS.txt
